<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>SEON Battle Ball</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="name-entry">
    <h1>SEON Battle Ball</h1>
    <input id="name-input" type="text" placeholder="닉네임을 입력하세요" maxlength="20" />
    <button id="join-button">Join</button>
  </div>
  <div id="lobby" style="display:none;">
    <h1>SEON Battle Ball</h1>
    <ul id="player-list"></ul>
    <button id="ready-button">Ready</button>
  </div>
  <div id="game-screen" style="display:none;">
    <canvas id="game-canvas" width="900" height="360"></canvas>
    <div id="controls-hint">↑ 점프 · ↓ 숙이기 · Space 공 던지기</div>
    <div id="results-overlay" style="display:none;">
      <h2>결과</h2>
      <ol id="results-list"></ol>
      <p id="results-note">잠시 후 로비로 돌아갑니다...</p>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
