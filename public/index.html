<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Coffee Run</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="name-entry">
    <h1>Coffee Run</h1>
    <input id="name-input" type="text" placeholder="닉네임을 입력하세요" maxlength="20" />
    <button id="join-button">Join</button>
  </div>
  <div id="lobby" style="display:none;">
    <h1>Coffee Run</h1>
    <ul id="player-list"></ul>
    <div id="equip-shop">
      <h3>착용 아이템 상점 (<span id="equip-tokens">10</span> 토큰)</h3>
      <ul id="equipped-list"></ul>
      <button id="roll-equip-button">🎲 아이템 뽑기 (<span id="equip-rolls-left">3</span>회 남음)</button>
      <div id="equip-offer" style="display:none;">
        <p>등급 <span id="equip-offer-tier"></span>성 중 하나 선택! (<span id="equip-offer-timer">5</span>초)</p>
        <div id="equip-offer-cards">
          <button id="equip-card-0" class="equip-card"></button>
          <button id="equip-card-1" class="equip-card"></button>
          <button id="equip-card-2" class="equip-card"></button>
        </div>
      </div>
    </div>
    <button id="ready-button">Ready</button>
    <button id="add-bot-button">봇 추가</button>
    <div class="controls-hint">1 / 2 / 3 뽑기 선택 · Space 아이템 사용 / 주사위 굴리기</div>
  </div>
  <div id="game-screen" style="display:none;">
    <canvas id="game-canvas" width="1400" height="360"></canvas>
    <ol id="live-rank-list"></ol>
    <div class="controls-hint">1 / 2 / 3 뽑기 선택 · Space 아이템 사용 / 주사위 굴리기</div>
    <div id="item-badge" style="display:none;"></div>
    <div id="gacha-overlay" style="display:none;">
      <h2>뽑기! (<span id="gacha-timer">5</span>초)</h2>
      <div id="gacha-timer-bar-track"><div id="gacha-timer-bar"></div></div>
      <div id="gacha-cards">
        <button id="gacha-card-0" class="gacha-card"></button>
        <button id="gacha-card-1" class="gacha-card"></button>
        <button id="gacha-card-2" class="gacha-card"></button>
      </div>
    </div>
    <div id="dice-overlay" style="display:none;">
      <h2>막판 스퍼트!</h2>
      <button id="dice-face">?</button>
      <p id="dice-hint">Space (또는 클릭)로 주사위를 굴리세요</p>
    </div>
    <div id="results-overlay" style="display:none;">
      <h2>결과</h2>
      <ol id="results-list"></ol>
      <p id="results-note">잠시 후 로비로 돌아갑니다...</p>
    </div>
  </div>
  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <script src="client.js"></script>
</body>
</html>
